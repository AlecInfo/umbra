name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  check:
    name: Typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pin pnpm to the exact version the lockfile was generated with, to avoid
      # frozen-lockfile mismatches on CI.
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install (whole workspace)
        run: pnpm install --frozen-lockfile

      - name: Typecheck API
        run: pnpm --filter=api typecheck

      - name: Build web
        run: pnpm --filter=web build

      # The landing is deployed from tags by deploy-landing.yml, which never
      # checked that it builds first.
      - name: Build landing
        run: pnpm --filter=landing build

      # The packaged apps embed this same build, client-rendered and static.
      # It is checked here because the two modes can diverge — anything that
      # only works with a server rendering it first breaks the apps and nothing
      # else. The Rust shell is not compiled: it needs GTK/WebKit system
      # libraries, so that belongs in a release workflow.
      - name: Build web for the packaged apps
        run: pnpm --filter=web build:app

  test:
    name: API tests
    runs-on: ubuntu-latest

    services:
      postgres:
        # Must be TimescaleDB, not plain postgres: the first migration creates
        # the extension and node_metrics is a hypertable.
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: umbra
          POSTGRES_PASSWORD: umbra
          POSTGRES_DB: umbra_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U umbra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      APP_KEY: ci-app-key-not-a-secret-32chars!
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USER: umbra
      DB_PASSWORD: umbra
      # Same name as .env.test uses locally. The suite truncates every table
      # between tests, so it must never share a database with anything else.
      DB_DATABASE: umbra_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install (whole workspace)
        run: pnpm install --frozen-lockfile

      # No migration step: the test bootstrap migrates the database itself and
      # rolls back on teardown, so an empty one is all the service needs.
      - name: Test
        run: pnpm --filter=api test

  # ── Publishing ──────────────────────────────────────────────────────────────
  # Images are pushed for main only, and only once the code has been typechecked
  # and tested. Nothing pulls them automatically yet: deployment is still
  # ./deploy.sh on the target host (see DEPLOYMENT.md).
  # ── Publishing ──────────────────────────────────────────────────────────────
  # Images are pushed for main only, and only once the code has been typechecked
  # and tested. Nothing pulls them automatically: deployment is ./deploy.sh on
  # the target host (see DEPLOYMENT.md).
  #
  # Built for amd64 and arm64 so the server can live on whatever machine the
  # user already owns — a Raspberry Pi is the archetypal self-hosting box, and
  # every base image the stack depends on (TimescaleDB, Headscale, node, caddy)
  # publishes arm64. Each architecture builds on a native runner and the two are
  # merged into one manifest afterwards: emulating arm64 through QEMU works but
  # turns a three-minute Node build into half an hour.
  publish-api:
    name: Publish image — API (${{ matrix.platform }})
    needs: [check, test]
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image owner
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      # ── Agent binaries ──────────────────────────────────────────────────
      # The API serves GET /releases/<file> (what install.sh downloads) from
      # apps/api/resources/releases/, which is gitignored — those are build
      # artifacts. They must be produced HERE, before the image is built, or the
      # published image ships an enrollment path that 404s. Go cross-compiles,
      # so the same three targets come out whichever runner we are on.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: agent/go.sum

      # Without the real key the script would silently mint a throwaway one, and
      # agents installed from this image could never accept a later update
      # (they verify against the key embedded at build time).
      - name: Require the signing key
        env:
          KEY: ${{ secrets.UMBRA_SIGNING_KEY_B64 }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::UMBRA_SIGNING_KEY_B64 secret is not set."
            echo "Agents built without it are permanently un-updatable."
            exit 1
          fi

      - name: Build and sign agent binaries
        env:
          UMBRA_SIGNING_KEY_B64: ${{ secrets.UMBRA_SIGNING_KEY_B64 }}
        run: ./agent/build-releases.sh

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest only: the tags are attached by the merge job below,
      # once both architectures exist.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ env.IMAGE_OWNER }}/umbra-api,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=api-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=api-${{ matrix.platform }}

      # The digest is stripped of its "sha256:" prefix in bash: GitHub
      # expressions have no such operator.
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: digests-api-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1

  merge-api:
    name: Publish image — API (manifest)
    needs: publish-api
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Lowercase image owner
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-api-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${IMAGE_OWNER}/umbra-api:latest \
            -t ghcr.io/${IMAGE_OWNER}/umbra-api:${GITHUB_SHA} \
            $(printf 'ghcr.io/'"${IMAGE_OWNER}"'/umbra-api@sha256:%s ' *)

  publish-web:
    name: Publish image — Web (${{ matrix.platform }})
    needs: [check, test]
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image owner
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ env.IMAGE_OWNER }}/umbra-web,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=web-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=web-${{ matrix.platform }}

      # The digest is stripped of its "sha256:" prefix in bash: GitHub
      # expressions have no such operator.
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: digests-web-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1

  merge-web:
    name: Publish image — Web (manifest)
    needs: publish-web
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Lowercase image owner
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-web-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${IMAGE_OWNER}/umbra-web:latest \
            -t ghcr.io/${IMAGE_OWNER}/umbra-web:${GITHUB_SHA} \
            $(printf 'ghcr.io/'"${IMAGE_OWNER}"'/umbra-web@sha256:%s ' *)
