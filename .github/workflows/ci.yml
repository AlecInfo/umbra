name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pin pnpm to the exact version the lockfile was generated with, to avoid
      # frozen-lockfile mismatches on CI.
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install (whole workspace)
        run: pnpm install --frozen-lockfile

      # AdonisJS's withAuthFinder mixin has known TS quirks; informational only.
      - name: Typecheck API
        run: pnpm --filter=api typecheck
        continue-on-error: true

      # The real gate: the web app must build.
      - name: Build web
        run: pnpm --filter=web build
