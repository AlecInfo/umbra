name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  docker-api:
    name: Docker — API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ghcr requires a lowercase repository name; the owner (AlecInfo) has
      # uppercase letters, so lowercase it before tagging.
      - name: Lowercase image owner
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/umbra-api:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/umbra-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-web:
    name: Docker — Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image owner
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/umbra-web:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/umbra-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
