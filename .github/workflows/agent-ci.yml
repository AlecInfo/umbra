name: Agent CI

on:
  push:
    branches: [main]
    paths: ['agent/**', '.github/workflows/agent-ci.yml']
  pull_request:
    paths: ['agent/**', '.github/workflows/agent-ci.yml']

defaults:
  run:
    working-directory: agent

jobs:
  build:
    name: Build & vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: agent/go.sum

      - name: Download modules
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # Same three targets build-releases.sh produces, so a compile error on an
      # architecture nobody develops on is caught here rather than at release.
      - name: Build (linux/amd64)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /dev/null .

      - name: Build (linux/arm64)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /dev/null .

      - name: Build (linux/armv7)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -o /dev/null .