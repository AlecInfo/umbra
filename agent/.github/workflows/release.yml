name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Cross-compile & publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Download modules
        run: go mod download

      - name: Build binaries
        env:
          VERSION: ${{ github.ref_name }}
          LDFLAGS: -X github.com/umbravpn/umbra-agent/internal/version.Current=${{ github.ref_name }} -w -s
        run: |
          mkdir -p dist

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -ldflags="$LDFLAGS" -o dist/umbra-agent-linux-amd64 .

          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -ldflags="$LDFLAGS" -o dist/umbra-agent-linux-arm64 .

          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 \
            go build -ldflags="$LDFLAGS" -o dist/umbra-agent-linux-armv7 .

      - name: Generate SHA-256 checksums
        run: |
          cd dist
          sha256sum umbra-agent-linux-amd64 > umbra-agent-linux-amd64.sha256
          sha256sum umbra-agent-linux-arm64 > umbra-agent-linux-arm64.sha256
          sha256sum umbra-agent-linux-armv7 > umbra-agent-linux-armv7.sha256
          sha256sum --check umbra-agent-linux-amd64.sha256
          sha256sum --check umbra-agent-linux-arm64.sha256
          sha256sum --check umbra-agent-linux-armv7.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/umbra-agent-linux-amd64
            dist/umbra-agent-linux-amd64.sha256
            dist/umbra-agent-linux-arm64
            dist/umbra-agent-linux-arm64.sha256
            dist/umbra-agent-linux-armv7
            dist/umbra-agent-linux-armv7.sha256
